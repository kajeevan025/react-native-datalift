buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 34)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            // ::: Code Generated by Copilot 3f9a1b2c-4d5e-6f70-8901-a2b3c4d5e6f7. This comment will be removed automatically after the file is saved :::
            // Bundle fine-tuned LayoutLMv3 ONNX model + label map + vocab into
            // the AAR/APK assets so resolveBundlePath() can extract them to
            // filesDir at runtime without any manual app-level configuration.
            assets.srcDirs = ['../datalift-models']
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.8.0')}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Google ML Kit - Text Recognition
    implementation "com.google.mlkit:text-recognition:16.0.0"

    // PDF rendering
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
}
